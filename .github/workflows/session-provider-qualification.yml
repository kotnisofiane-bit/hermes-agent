name: Persisted session provider qualification
on:
  push:
    branches: [fix/api-session-persisted-provider]
    paths:
      - gateway/platforms/api_server.py
      - tests/gateway/test_api_server_persisted_provider.py
      - .github/workflows/session-provider-qualification.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.28"
      - run: uv sync --locked --python 3.11 --extra dev --extra messaging --extra anthropic
      - name: Prove regression fails on the unchanged Personal base
        shell: bash
        run: |
          cp gateway/platforms/api_server.py /tmp/api_server_fixed.py
          trap 'cp /tmp/api_server_fixed.py gateway/platforms/api_server.py' EXIT
          git show d15e3714fddc7018e9b4e1993fe6af539af5bd7a:gateway/platforms/api_server.py > gateway/platforms/api_server.py
          if scripts/run_tests.sh tests/gateway/test_api_server_persisted_provider.py --file-retries 0; then
            echo "Regression unexpectedly passed on the base"
            exit 1
          fi
      - name: Provider regression, API model routing and runtime resolution
        run: >-
          scripts/run_tests.sh
          tests/gateway/test_api_server_persisted_provider.py
          tests/gateway/test_api_server.py
          tests/gateway/test_custom_provider_request_overrides.py
          tests/hermes_cli/test_runtime_provider_resolution.py
          tests/hermes_cli/test_custom_provider_identity.py
          --file-retries 0
